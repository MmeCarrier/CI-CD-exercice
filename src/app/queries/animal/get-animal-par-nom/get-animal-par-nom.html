<h2>Recherche par nom</h2>

<input
  type="text"
  placeholder="Entrez le nom d'un animal..."
  [(ngModel)]="nom"
/>

<button (click)="rechercher()">Rechercher</button>

@if (animals.length > 0) {
  <ul>
    @for (animal of animals; track animal.animalId) {
      <li>
        Nom: {{ animal.nom }} Espèce: {{ animal.espece }} Secteur: {{ animal.secteurNom}} Stérilisé: {{ animal.sterilise ? 'Oui' : 'Non' }}

      </li>
    }
  </ul>
} @else {
  <p>Aucun animal trouvé.</p>
}
